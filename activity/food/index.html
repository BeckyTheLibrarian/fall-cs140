<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Class, ID &amp; Inheritance Practice</title>
</head>
<body>

  <!-- ID: only ONE element on the page can have id="page-title" -->
  <h1 id="page-title">My Favorite Foods</h1>

  <p>This paragraph has no class or id. Its color and font come from the body.</p>

  <!-- CLASS: many elements can share class="favorite" -->
  <h2>Breakfast</h2>
  <p class="favorite">Malasadas</p>
  <p>Oatmeal</p>

  <h2>Lunch</h2>
  <p>Sandwich</p>
  <p class="favorite">Plate lunch</p>

  <h2>Dinner</h2>
  <p class="favorite">Poke bowl</p>
  <p>Spaghetti</p>

  <!-- INHERITANCE: everything inside this box gets the box's text color -->
  <div id="special-box">
    <h2>Dessert</h2>
    <p>Shave ice</p>
    <p>Haupia pie</p>
  </div>

  <!-- ONE element can have BOTH an id and a class -->
  <p id="footer" class="note">Made in CS 140.</p>

  <!--
    YOUR TURN (write your answers or do these in the files):
    1. Add class="favorite" to one more food. Save and refresh.
    2. Change the color in the .favorite rule in style.css.
       How many foods changed?
    3. Change the color in the #page-title rule. How many things changed?
    4. Add a new <p> inside the special-box div. What color is it?
       You didn't give it any styles. Why is it that color?
  -->

</body>
</html>  
</body>
</html>
